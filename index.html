// Format an ISO timestamp as "3m ago", "2h ago", "yesterday", etc.
// Returns null if the input is missing/invalid so the caller can hide the UI.
function timeAgo(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return null;
  const diffSec = (Date.now() - t) / 1000;
  if (diffSec < 30)   return "just now";
  if (diffSec < 90)   return "1m ago";
  if (diffSec < 3600) return `${Math.round(diffSec / 60)}m ago`;
  if (diffSec < 7200) return "1h ago";
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)}h ago`;
  if (diffSec < 172800) return "yesterday";
  return `${Math.round(diffSec / 86400)}d ago`;
}

// Format minutes as "4h 12m" / "42m" / "<1m". Used by ServerPulse and Logbook.
function fmtDur(m) {
  if (m < 1) return "<1m";
  if (m < 60) return `${Math.round(m)}m`;
  const h = Math.floor(m / 60);
  const r = Math.round(m - h * 60);
  return r === 0 ? `${h}h` : `${h}h ${r}m`;
}

// ─── TOP BAR ──────────────────────────────────────────────────────────
function TopBar({ status, summary, onRefresh }) {
  const [copied, setCopied] = useState(null);
  const [tick, setTick] = useState(0); // forces relative-time re-render every 30s
  const copy = (text, key) => {
    navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(null), 1500);
  };

  // Re-render every 30s so "3m ago" naturally becomes "4m ago" without a poll.
  useEffect(() => {
    const id = setInterval(() => setTick((n) => n + 1), 30_000);
    return () => clearInterval(id);
  }, []);

  const isOnline = status?.online;
  const isSleeping = status && !status.online;
  const statsAge = timeAgo(summary?.updated_at);

  return (
    <div style={S.topBar}>
      {/* Row 1: Title left, status right */}
      <div style={S.topRow1}>
        <h1 style={S.topTitle}>Bangman's Abode</h1>
        <div style={S.statusDotWrap}>
          <div style={{
            ...S.statusDot,
            background: isOnline ? C.online : isSleeping ? C.sleeping : C.offline,
            boxShadow: `0 0 10px ${isOnline ? C.online : isSleeping ? C.sleeping : C.offline}50`,
          }} />
          <span style={S.statusLabel}>
            {isOnline ? "Online" : isSleeping ? "Sleeping" : "Checking..."}
          </span>
          {isOnline && (
            <span style={S.playerCount}>{status.players?.online || 0} players</span>
          )}
          {statsAge && (
            <span
              style={S.statsAge}
              title="When the playtime tracker last recorded a sample. Updates every ~5 min."
            >
              · stats {statsAge}
            </span>
          )}
          <button onClick={onRefresh} style={S.refreshBtn} title="Refresh status">
            {Icons.refresh}
          </button>
        </div>
      </div>
      {/* Row 2: Full-width address buttons */}
      <div style={S.topRow2}>
        <button onClick={() => copy(SERVER_JAVA, "java")} style={{
          ...S.addressPill,
          borderColor: copied === "java" ? C.accent : C.border,

          <span style={S.addressText}>{SERVER_JAVA}</span>
          <span style={S.copyLabel}>{copied === "java" ? "Copied!" : "Copy"}</span>
        </button>
        <button onClick={() => copy(SERVER_BEDROCK, "bedrock")} style={{
          ...S.addressPill,
          borderColor: copied === "bedrock" ? C.accent : C.border,
        }}>
          <span style={S.addressType}>Bedrock</span>
          <span style={S.addressText}>{SERVER_BEDROCK}</span>
          <span style={S.copyLabel}>{copied === "bedrock" ? "Copied!" : "Copy"}</span>
        </button>

  );
}

// ─── SERVER PULSE (Home strip) ────────────────────────────────────────
// Compact 3-column dashboard for the Home tab. Mirrors a slice of Logbook
// but tuned for "glance and go" — currently online, all-time top 3, and a
// rotating highlight stat that picks the most evocative fact from the data.
function ServerPulse({ summary, onViewLogbook }) {
  // Loading or no-data state — render nothing rather than a placeholder block
  // that would push the map down for no reason. The map is the load-bearing
  // element of the home page, this strip is supplementary.
  if (!summary || typeof summary !== "object") return null;

  const nowOnline = summary.now_online || [];
  const totals = summary.totals || {};
  const byHour = summary.activity_by_hour || new Array(24).fill(0);

  // Top-3 all-time leaderboard, derived from totals (richer than the
  // pre-sorted `leaderboard` field — but they should agree).
  const top3 = Object.entries(totals)
    .map(([name, v]) => ({ name, minutes: v.minutes || 0 }))
    .sort((a, b) => b.minutes - a.minutes)
    .slice(0, 3);

  // ─── Highlight stat picker ──────────────────────────────────────────
  // Priority order: big session > active week > clear peak hour >
  // lifetime milestone > cold start. Returns { label, value, sub }.
  // Each branch picks the *most evocative* fact available given current data.
  const highlight = (() => {
    // 1. Notable single session (>2hr)
    let bestSess = { name: null, mins: 0 };
    for (const [name, v] of Object.entries(totals)) {
      if ((v.longest_session_min || 0) > bestSess.mins) {
        bestSess = { name, mins: v.longest_session_min };
      }
    }
    if (bestSess.mins >= 120) {
      return {
        label: "Longest session",
        value: fmtDur(bestSess.mins),
        sub: `by ${bestSess.name}`,
      };
    }

    // 2. Active week — total minutes this week across everyone
    const thisWeek = summary.this_week || {};
    const weekMin = Object.values(thisWeek).reduce((a, v) => a + (v.minutes || 0), 0);
    if (weekMin >= 60) {
      return {
        label: "This week",
        value: fmtDur(weekMin),
        sub: "played across the server",
      };
    }

    // 3. Clear peak hour (one hour is >2× the 24-hour average)
    const hourSum = byHour.reduce((a, v) => a + v, 0);
    if (hourSum > 0) {
      const avg = hourSum / 24;
      let peakHour = 0, peakVal = 0;
      for (let i = 0; i < 24; i++) {
        if (byHour[i] > peakVal) { peakVal = byHour[i]; peakHour = i; }
      }
      if (peakVal >= avg * 2 && peakVal >= 10) {
        return {
          label: "Busiest hour",
          value: `${peakHour.toString().padStart(2, "0")}:00 UTC`,
          sub: "when the server lights up",
        };
      }
    }

    // 4. Lifetime milestone (>10hr total across everyone)
    const lifetimeMin = Object.values(totals).reduce((a, v) => a + (v.minutes || 0), 0);
    if (lifetimeMin >= 600) {
      return {
        label: "Total played",
        value: fmtDur(lifetimeMin),
        sub: "logged so far",
      };
    }

    // 5. Cold start — count tracked players, even if minutes are zero
    const trackedCount = Object.keys(totals).length;
    return {
      label: "Just getting started",
      value: trackedCount > 0 ? `${trackedCount}` : "0",
      sub: trackedCount === 1 ? "player tracked" : "players tracked",
    };
  })();

  return (
    <div style={S.pulseWrap}>
      <div className="pulse-grid" style={S.pulseGrid}>

        {/* Column 1: Currently online */}
        <div style={S.pulseCol}>
          <div style={S.pulseLabel}>Online now</div>
          {nowOnline.length > 0 ? (
            <div style={S.pulseOnlineList}>
              {nowOnline.slice(0, 4).map((name) => (
                <div key={name} style={S.pulseOnlineRow}>
                  <img
                    src={`https://mc-heads.net/avatar/${name}/24`}
                    alt=""
                    style={S.pulseAvatar}
                    onError={(e) => { e.target.style.display = "none"; }}
                  />
                  <span style={S.pulseOnlineName}>{name}</span>
                </div>
              ))}
              {nowOnline.length > 4 && (
                <div style={S.pulseOnlineMore}>+{nowOnline.length - 4} more</div>
              )}
            </div>
          ) : (
            <div style={S.pulseEmpty}>
              <span style={{ fontSize: 18 }}>💤</span>
              <span>Empty</span>
            </div>
          )}
        </div>

        {/* Column 2: All-time top 3 */}
        <div style={S.pulseCol}>
          <div style={S.pulseLabel}>Top 3 all-time</div>
          {top3.length > 0 && top3[0].minutes > 0 ? (
            <div style={S.pulseTopList}>
              {top3.map((p, i) => (
                <div key={p.name} style={S.pulseTopRow}>
                  <span style={S.pulseRank}>#{i + 1}</span>
                  <img
                    src={`https://mc-heads.net/avatar/${p.name}/20`}
                    alt=""
                    style={S.pulseAvatar}
                    onError={(e) => { e.target.style.display = "none"; }}
                  />
                  <span style={S.pulseTopName}>{p.name}</span>
                  <span style={S.pulseTopTime}>{fmtDur(p.minutes)}</span>
                </div>
              ))}
            </div>
          ) : (
            <div style={S.pulseEmpty}>
              <span>No leader yet</span>
            </div>
          )}
        </div>

        {/* Column 3: Rotating highlight stat */}
        <div style={S.pulseCol}>
          <div style={S.pulseLabel}>{highlight.label}</div>
          <div style={S.pulseHighlightValue}>{highlight.value}</div>
          <div style={S.pulseHighlightSub}>{highlight.sub}</div>
        </div>
      </div>

      {/* View Logbook footer */}
      <button onClick={onViewLogbook} style={S.pulseViewBtn} className="pulse-view-btn">
        <span>View Logbook</span>
        <span style={S.pulseViewArrow}>→</span>
      </button>
    </div>
  );
}

// ─── LOGBOOK TAB ──────────────────────────────────────────────────────
// Reads ./data/playtime-summary.json (already fetched at the Dashboard level
// and passed in as `summary`). Four sections: currently online, leaderboard,
// activity bars, last seen. All-empty case handled gracefully — the poller
// might not have run yet, or no one has played yet.
function LogbookTab({ summary }) {
  // Sort key for the leaderboard: "minutes" | "sessions" | "longest"
  const [sortKey, setSortKey] = useState("minutes");

  // Loading state: Dashboard sets summary=null until first fetch completes.
  if (summary === null) {
    return (
      <div style={S.logWrap}>
        <h2 style={S.sectionTitle}>Logbook</h2>
        <p style={S.sectionSub}>Loading the receipts...</p>
      </div>
    );
  }

  // Hard empty state: the poller has never produced a summary file (404).
  // Different from "summary exists but no players yet" which we handle below.
  // We can't perfectly distinguish these — Dashboard's fetch silently swallows
  // the 404 leaving summary=null forever, so by the time we get here `summary`
  // is at least an object. But just in case it's a literal empty object:
  if (!summary || typeof summary !== "object") {
    return (
      <div style={S.logWrap}>
        <h2 style={S.sectionTitle}>Logbook</h2>
        <p style={S.sectionSub}>
          No stats yet. The poller runs every 5 minutes — check back soon.
        </p>
      </div>
    );
  }

  const nowOnline = summary.now_online || [];
  const totals = summary.totals || {};
  const lastSeen = summary.last_seen || {};
  const byHour = summary.activity_by_hour || new Array(24).fill(0);
  const byDow = summary.activity_by_dow || new Array(7).fill(0);
  const everyoneEver = Object.keys(totals);

  // Build the leaderboard rows. Always derive from `totals` (richer than the
  // pre-sorted `leaderboard` field) so we can sort by sessions / longest too.
  const rows = everyoneEver.map((name) => ({
    name,
    minutes: totals[name].minutes || 0,
    sessions: totals[name].sessions || 0,
    longest: totals[name].longest_session_min || 0,
  }));
  rows.sort((a, b) => {
    if (sortKey === "minutes") return b.minutes - a.minutes;
    if (sortKey === "sessions") return b.sessions - a.sessions;
    return b.longest - a.longest;
  });

  // Last seen, sorted most-recent-first. ISO strings sort correctly as strings.
  const lastSeenRows = Object.entries(lastSeen)
    .map(([name, iso]) => ({ name, iso }))
    .sort((a, b) => b.iso.localeCompare(a.iso));

  // Dashboard sort headers: clicking re-sorts. Active key gets the green pill.
  const SortHeader = ({ k, label, align = "right" }) => (
    <button
      onClick={() => setSortKey(k)}
      style={{
        ...S.logSortBtn,
        color: sortKey === k ? C.accent : C.textMuted,
        background: sortKey === k ? C.accentGlow : "transparent",
        textAlign: align,
      }}
    >
      {label}
      {sortKey === k && <span style={S.logSortArrow}>↓</span>}
    </button>
  );

  return (
    <div style={S.logWrap}>
      <h2 style={S.sectionTitle}>Logbook</h2>
      <p style={S.sectionSub}>Receipts from the server</p>

      {/* ─── Section 1: Currently online (full-width banner) ─── */}
      <section style={S.logOnlineBanner}>
        <div style={S.logOnlineHead}>
          <span style={S.logOnlineDot} />
          <span style={S.logOnlineLabel}>Currently online</span>
          <span style={S.logOnlineCount}>
            {nowOnline.length} {nowOnline.length === 1 ? "player" : "players"}
          </span>
        </div>
        {nowOnline.length > 0 ? (
          <div style={S.logOnlineList}>
            {nowOnline.map((name) => (
              <div key={name} style={S.logOnlineChip}>
                <img
                  src={`https://mc-heads.net/avatar/${name}/32`}
                  alt=""
                  style={S.logOnlineAvatar}
                  onError={(e) => { e.target.style.display = "none"; }}
                />
                <span style={S.logOnlineName}>{name}</span>
              </div>
            ))}
          </div>
        ) : (
          <div style={S.logOnlineEmpty}>
            <span style={{ fontSize: 22 }}>💤</span>
            <span>Nobody's on right now. Imagine having friends.</span>
          </div>
        )}
      </section>

      {/* ─── Section 2: Two-column row — leaderboard | activity ─── */}
      <div className="logbook-grid" style={S.logGrid}>
        {/* Leaderboard */}
        <section style={S.logCard}>
          <div style={S.logCardHead}>
            <span style={S.logCardTitle}>All-time leaderboard</span>
            <span style={S.logCardSub}>{rows.length} {rows.length === 1 ? "player tracked" : "players tracked"}</span>
          </div>

          {rows.length === 0 ? (
            <div style={S.logCardEmpty}>
              No one has logged in yet. The board is open.
            </div>
          ) : (
            <>
              {/* Sort headers row */}
              <div style={S.logTableHeader}>
                <span style={{ ...S.logColPlayer, color: C.textMuted, fontSize: 10 }}>
                  PLAYER
                </span>
                <SortHeader k="minutes" label="TIME" />
                <SortHeader k="sessions" label="SESSIONS" />
                <SortHeader k="longest" label="LONGEST" />
              </div>

              {/* Rows */}
              <div style={S.logTableBody}>
                {rows.map((r, i) => {
                  const isOnline = nowOnline.includes(r.name);
                  return (
                    <div key={r.name} style={S.logRow}>
                      <span style={S.logRank}>{i + 1}</span>
                      <div style={S.logColPlayer}>
                        <img
                          src={`https://mc-heads.net/avatar/${r.name}/24`}
                          alt=""
                          style={S.logAvatar}
                          onError={(e) => { e.target.style.display = "none"; }}
                        />
                        <span style={{
                          ...S.logName,
                          color: isOnline ? C.accent : C.text,
                        }}>
                          {r.name}
                        </span>
                        {isOnline && <span style={S.logLiveDot} title="Online now" />}
                      </div>
                      <span style={{
                        ...S.logCellNum,
                        color: sortKey === "minutes" ? C.accent : C.text,
                      }}>{fmtDur(r.minutes)}</span>
                      <span style={{
                        ...S.logCellNum,
                        color: sortKey === "sessions" ? C.accent : C.text,
                      }}>{r.sessions}</span>
                      <span style={{
                        ...S.logCellNum,
                        color: sortKey === "longest" ? C.accent : C.text,
                      }}>{fmtDur(r.longest)}</span>
                    </div>
                  );
                })}
              </div>
            </>
          )}
        </section>

        {/* Activity (two stacked 1D bar charts) */}
        <section style={S.logCard}>
          <div style={S.logCardHead}>
            <span style={S.logCardTitle}>Activity</span>
            <span style={S.logCardSub}>When the server actually gets used</span>
          </div>

          {byHour.every((v) => v === 0) && byDow.every((v) => v === 0) ? (
            <div style={S.logCardEmpty}>
              Not enough data to chart. Play more, the bars will fill in.
            </div>
          ) : (
            <div style={S.logActivityWrap}>
              <ActivityBars
                title="By hour of day"
                sub="UTC. Bars are total player-minutes recorded in that hour."
                data={byHour}
                labelFor={(i) => (i % 6 === 0 ? `${i.toString().padStart(2, "0")}:00` : "")}
              />
              <ActivityBars
                title="By day of week"
                sub="Sunday through Saturday."
                data={byDow}
                labelFor={(i) => ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][i]}
                alwaysLabel
              />
            </div>
          )}
        </section>
      </div>

      {/* ─── Section 3: Last seen (full-width strip) ─── */}
      <section style={S.logLastSeen}>
        <div style={S.logCardHead}>
          <span style={S.logCardTitle}>Last seen</span>
          <span style={S.logCardSub}>The roster, sorted by who showed up most recently</span>
        </div>

        {lastSeenRows.length === 0 ? (
          <div style={S.logCardEmpty}>
            Nobody's ever been online. This is bleak.
          </div>
        ) : (
          <div style={S.logLastSeenList}>
            {lastSeenRows.map(({ name, iso }) => {
              const isOnline = nowOnline.includes(name);
              return (
                <div key={name} style={S.logLastSeenRow}>
                  <img
                    src={`https://mc-heads.net/avatar/${name}/24`}
                    alt=""
                    style={S.logAvatar}
                    onError={(e) => { e.target.style.display = "none"; }}
                  />
                  <span style={{
                    ...S.logName,
                    color: isOnline ? C.accent : C.text,
                  }}>
                    {name}
                  </span>
                  <span style={S.logLastSeenWhen}>
                    {isOnline ? "online now" : timeAgo(iso) || "—"}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </section>
    </div>
  );
}

// ─── ACTIVITY BARS (used inside Logbook) ──────────────────────────────
// Renders a small 1D bar chart from a numeric array. Bar height is scaled
// to the array's max so a quiet week and a heavy week both look readable.
function ActivityBars({ title, sub, data, labelFor, alwaysLabel = false }) {
  const max = Math.max(1, ...data); // avoid /0; if all zero, bars all show as min
  return (
    <div style={S.logBarsBlock}>
      <div style={S.logBarsHead}>
        <span style={S.logBarsTitle}>{title}</span>
        <span style={S.logBarsSub}>{sub}</span>
      </div>
      <div style={S.logBarsRow}>
        {data.map((v, i) => {
          const pct = (v / max) * 100;
          // A floor of 4% so empty hours still show a faint baseline tick —
          // makes the chart shape readable instead of a row of nothing.
          const h = v === 0 ? 4 : Math.max(8, pct);
          return (
            <div key={i} style={S.logBarCol} title={`${labelFor(i) || i}: ${Math.round(v)} player-minutes`}>
              <div style={{
                ...S.logBar,
                height: `${h}%`,
                background: v === 0 ? C.bg3 : C.accent,
                opacity: v === 0 ? 0.5 : 0.4 + 0.6 * (pct / 100),
              }} />
              <span style={{
                ...S.logBarLabel,
                visibility: alwaysLabel || labelFor(i) ? "visible" : "hidden",
              }}>
                {labelFor(i) || i}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── FIRST-VISIT MAP OVERLAY ──────────────────────────────────────────
const HINT_KEY = "bangman.mapHintSeen";
function MapHintOverlay() {
  const [visible, setVisible] = useState(() => {
    try { return localStorage.getItem(HINT_KEY) !== "1"; }
    catch (e) { return true; }
  });
  if (!visible) return null;
  const dismiss = () => {
    try { localStorage.setItem(HINT_KEY, "1"); } catch (e) { /* private mode etc. */ }
    setVisible(false);
  };
  return (
    <div style={S.hintBackdrop} onClick={dismiss}>
      <div style={S.hintCard} onClick={(e) => e.stopPropagation()}>
        <button onClick={dismiss} style={S.hintClose} title="Dismiss" aria-label="Dismiss">
          {Icons.close}
        </button>
        <div style={S.hintTitle}>Welcome to the map</div>
        <div style={S.hintSub}>Switch view modes from BlueMap's top-right toolbar.</div>
        <div style={S.hintRows}>
          {MAP_MODES.map((m) => (
            <div key={m.id} style={S.hintRow}>
              <div style={S.mapGuideIcon}>{m.icon}</div>
              <div style={S.mapGuideRowText}>
                <div style={S.mapGuideRowTitle}>
                  {m.title}
                  {m.badge && <span style={S.mapGuideBadge}>{m.badge}</span>}
                </div>
                <div style={S.mapGuideRowDesc}>{m.desc}</div>
              </div>
            </div>
          ))}
        </div>
        <button onClick={dismiss} style={S.hintCta}>Got it</button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────
function Dashboard() {
  const [tab, setTab] = useState("home");
  const [status, setStatus] = useState(null);
  const [summary, setSummary] = useState(null);

  const fetchStatus = useCallback(async () => {
    try {
      const r = await fetch(STATUS_API, { headers: { "User-Agent": "BangmanDash/2.0" } });
      if (r.ok) setStatus(await r.json());
    } catch (e) { /* silent */ }
  }, []);

  // Fetch the rolled-up stats file produced by the GitHub Action poller.
  // Cache-busting query param so we always get the freshest commit, not
  // a stale CDN copy. If the file doesn't exist yet (Action hasn't run),
  // the catch swallows it and the indicator just doesn't render.
  const fetchSummary = useCallback(async () => {
    try {
      const r = await fetch(`./data/playtime-summary.json?t=${Date.now()}`);
      if (r.ok) setSummary(await r.json());
    } catch (e) { /* silent */ }
  }, []);

  const refreshAll = useCallback(() => {
    fetchStatus();
    fetchSummary();
  }, [fetchStatus, fetchSummary]);

  useEffect(() => {
    refreshAll();
    const t = setInterval(refreshAll, REFRESH_MS);
    return () => clearInterval(t);
  }, [refreshAll]);

  return (
    <div style={S.root}>
      <Sidebar active={tab} onChange={setTab} />
      <div style={S.main}>
        <TopBar status={status} summary={summary} onRefresh={refreshAll} />
        <div style={S.content}>
          {tab === "home" && (
            <>
              <StatusCards status={status} />
              <div style={S.connectCTA} onClick={() => setTab("connect")}>
                <div style={S.ctaLeft}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.accentBright} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2a4 4 0 014 4c0 3-4 6-4 6s-4-3-4-6a4 4 0 014-4z" />
                    <circle cx="12" cy="6" r="1" fill={C.accentBright} />
                    <path d="M12 14v4M8 22h8" />
                  </svg>
                  <div>
                    <span style={S.ctaTitle}>I don't know what to do bro</span>
                    <span style={S.ctaDesc}>Step-by-step guides for PC, Xbox, PlayStation, and Switch</span>
                  </div>
                </div>
                <span style={S.ctaArrow}>→</span>
              </div>
              <ServerPulse summary={summary} onViewLogbook={() => setTab("logbook")} />
              <MapControlsGuide />
              <MapSection status={status} />
            </>
          )}
          {tab === "map" && <MapSection status={status} fullscreen />}
          {tab === "connect" && <ConnectTab />}
          {tab === "logbook" && <LogbookTab summary={summary} />}
          {tab === "dad" && (
            <div style={S.dadWrap}>
              <img src={DAD_IMG} alt="Dad" style={S.dadImg} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  },
  logOnlineName: {
    fontSize: 14, fontWeight: 600, color: C.accent,
  },
  logOnlineEmpty: {
    display: "flex", alignItems: "center", gap: 12,
    padding: "8px 4px", fontSize: 13, color: C.textDim,
  },

  // Section 2: 2-column grid (leaderboard | activity)
  logGrid: {
    display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20,
    alignItems: "start",
  },
  logCard: {
    background: C.bg2, border: `1px solid ${C.border}`, borderRadius: 14,
    padding: "18px 20px 20px",
    display: "flex", flexDirection: "column", gap: 14,
  },
  logCardHead: {
    display: "flex", flexDirection: "column", gap: 2,
    paddingBottom: 12, borderBottom: `1px solid ${C.border}`,
  },
  logCardTitle: {
    fontSize: 15, fontWeight: 600, color: C.text,
    fontFamily: '"Chakra Petch", sans-serif',
  },
  logCardSub: { fontSize: 12, color: C.textMuted, lineHeight: 1.4 },
  logCardEmpty: {
    padding: "32px 12px", textAlign: "center",
    fontSize: 13, color: C.textDim, lineHeight: 1.5,
    background: C.bg1, border: `1px dashed ${C.border}`, borderRadius: 10,
  },

  // Leaderboard table
  logTableHeader: {
    display: "grid",
    gridTemplateColumns: "26px minmax(0, 1fr) 70px 80px 80px",
    alignItems: "center", gap: 8,
    padding: "0 4px 6px",
    borderBottom: `1px solid ${C.border}`,
  },
  logSortBtn: {
    fontSize: 10, fontWeight: 700, letterSpacing: 1,
    fontFamily: '"Chakra Petch", sans-serif',
    border: "none", padding: "4px 8px", borderRadius: 6,
    cursor: "pointer", transition: "all 0.15s",
    display: "inline-flex", alignItems: "center", justifyContent: "flex-end",
    gap: 4,
  },
  logSortArrow: { fontSize: 9, lineHeight: 1 },
  logTableBody: {
    display: "flex", flexDirection: "column", gap: 2,
  },
  logRow: {
    display: "grid",
    gridTemplateColumns: "26px minmax(0, 1fr) 70px 80px 80px",
    alignItems: "center", gap: 8,
    padding: "8px 4px",
    borderRadius: 8, transition: "background 0.15s",
  },
  logRank: {
    fontSize: 11, color: C.textMuted, fontWeight: 600,
    fontFamily: '"JetBrains Mono", monospace', textAlign: "center",
  },
  logColPlayer: {
    display: "flex", alignItems: "center", gap: 8, minWidth: 0,
  },
  logAvatar: {
    width: 22, height: 22, borderRadius: 4, imageRendering: "pixelated",
    flexShrink: 0,
  },
  logName: {
    fontSize: 13, fontWeight: 500,
    overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
  },
  logLiveDot: {
    width: 6, height: 6, borderRadius: "50%", background: C.online,
    boxShadow: `0 0 6px ${C.online}`, flexShrink: 0,
  },
  logCellNum: {
    fontSize: 13, fontWeight: 500, textAlign: "right",
    fontFamily: '"JetBrains Mono", monospace',
  },

  // Activity (two stacked bar blocks)
  logActivityWrap: { display: "flex", flexDirection: "column", gap: 18 },
  logBarsBlock: { display: "flex", flexDirection: "column", gap: 8 },
  logBarsHead: { display: "flex", flexDirection: "column", gap: 2 },
  logBarsTitle: {
    fontSize: 12, fontWeight: 600, color: C.text, letterSpacing: 0.3,
    fontFamily: '"Chakra Petch", sans-serif',
  },
  logBarsSub: { fontSize: 11, color: C.textMuted, lineHeight: 1.4 },
  logBarsRow: {
    display: "flex", alignItems: "flex-end", gap: 3,
    height: 90, paddingTop: 8,
    borderBottom: `1px solid ${C.border}`,
    paddingBottom: 4,
  },
  logBarCol: {
    flex: 1, minWidth: 0,
    display: "flex", flexDirection: "column", alignItems: "center",
    justifyContent: "flex-end", gap: 4,
    height: "100%",
  },
  logBar: {
    width: "100%", borderRadius: "3px 3px 0 0",
    transition: "height 0.2s",
  },
  logBarLabel: {
    fontSize: 9, color: C.textMuted, marginTop: 4,
    fontFamily: '"JetBrains Mono", monospace',
    height: 11, // reserve space so hidden labels don't shift bar height
  },

  // Section 3: Last seen strip
  logLastSeen: {
    background: C.bg2, border: `1px solid ${C.border}`, borderRadius: 14,
    padding: "18px 20px 20px",
    display: "flex", flexDirection: "column", gap: 14,
  },
  logLastSeenList: {
    display: "grid",
    gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))",
    gap: 8,
  },
  logLastSeenRow: {
    display: "flex", alignItems: "center", gap: 10,
    padding: "8px 12px",
    background: C.bg1, border: `1px solid ${C.border}`, borderRadius: 8,
  },
  logLastSeenWhen: {
    fontSize: 11, color: C.textMuted, marginLeft: "auto",
    fontFamily: '"JetBrains Mono", monospace',
  },
};

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(Dashboard));
  </script>
</body>
</html>
