// ─── TEXT REFLOW ENGINE ───────────────────────────────────────────────
function reflowAroundObstacles(text, font, containerWidth, lineHeight, obstacles) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = font;
  const words = text.split(" ");
  const lines = [];
  let wordIdx = 0;
  let y = 0;
  while (wordIdx < words.length && y < 2000) {
    let availW = containerWidth;
    let xOff = 0;
    for (const o of obstacles) {
      if (o.y < y + lineHeight && o.y + o.h > y) {
        if (o.x < containerWidth / 2) {
          xOff = Math.max(xOff, o.x + o.w + 10);
          availW = containerWidth - xOff;
        } else {
          availW = Math.min(availW, o.x - 10) - xOff;
        }
      }
    }
    if (availW < 30) { lines.push({ text: "", x: xOff, y, w: 0 }); y += lineHeight; continue; }
    let cur = "";
    while (wordIdx < words.length) {
      const test = cur ? cur + " " + words[wordIdx] : words[wordIdx];
      if (ctx.measureText(test).width > availW && cur) break;
      cur = test;
      wordIdx++;
    }
    lines.push({ text: cur, x: xOff, y, w: ctx.measureText(cur).width });
    y += lineHeight;
  }
  return lines;
}

// ─── DRAGGABLE BLOCK ──────────────────────────────────────────────────
function DraggableBlock({ type, ix, iy, onMove, size = 48 }) {
  const [pos, setPos] = useState({ x: ix, y: iy });
  const [drag, setDrag] = useState(false);
  const off = useRef({ x: 0, y: 0 });
  const ref = useRef(null);

  const start = useCallback((cx, cy) => {
    const r = ref.current.getBoundingClientRect();
    off.current = { x: cx - r.left, y: cy - r.top };
    setDrag(true);
  }, []);

  useEffect(() => {
    if (!drag) return;
    const move = (e) => {
      e.preventDefault();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const p = ref.current.parentElement.getBoundingClientRect();
      const np = {
        x: Math.max(0, Math.min(p.width - size, cx - p.left - off.current.x)),
        y: Math.max(0, Math.min(p.height - size, cy - p.top - off.current.y)),
      };
      setPos(np);
      onMove(type, np.x, np.y, size, size);
    };
    const end = () => setDrag(false);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    window.addEventListener("touchmove", move, { passive: false });
    window.addEventListener("touchend", end);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", end);
      window.removeEventListener("touchmove", move);
      window.removeEventListener("touchend", end);
    };
  }, [drag, onMove, type, size]);

  return (
    <div
      ref={ref}
      onMouseDown={(e) => start(e.clientX, e.clientY)}
      onTouchStart={(e) => start(e.touches[0].clientX, e.touches[0].clientY)}
      style={{
        position: "absolute", left: pos.x, top: pos.y, width: size, height: size,
        cursor: drag ? "grabbing" : "grab", zIndex: drag ? 100 : 10,
        filter: drag ? "drop-shadow(0 6px 16px rgba(0,0,0,0.6))" : "drop-shadow(0 2px 6px rgba(0,0,0,0.3))",
        transition: drag ? "none" : "filter 0.2s", userSelect: "none", touchAction: "none",
        borderRadius: 4, overflow: "hidden",
      }}
    >
      <BlockSprite type={type} size={size} />
    </div>
  );
}

// ─── REFLOW TEXT COMPONENT ────────────────────────────────────────────
function ReflowText({ text, obstacles, color = C.text }) {
  const ref = useRef(null);
  const [lines, setLines] = useState([]);
  const font = '13px "Chakra Petch", sans-serif';
  const lh = 22;

  useEffect(() => {
    if (!ref.current) return;
    const w = ref.current.offsetWidth;
    setLines(reflowAroundObstacles(text, font, w, lh, obstacles));
  }, [text, obstacles]);

  useEffect(() => {
    const obs = new ResizeObserver(() => {
      if (!ref.current) return;
      const w = ref.current.offsetWidth;
      setLines(reflowAroundObstacles(text, font, w, lh, obstacles));
    });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} style={{ position: "relative", width: "100%", minHeight: lines.length * lh + 10 }}>
      {lines.map((l, i) => (
        <span key={i} style={{
          position: "absolute", left: l.x, top: l.y, whiteSpace: "nowrap",
          fontFamily: '"Chakra Petch", sans-serif', fontSize: 13, color,
          lineHeight: lh + "px", letterSpacing: 0.3,
        }}>{l.text}</span>
      ))}
    </div>
  );
}

// ─── TOP BAR ──────────────────────────────────────────────────────────
function TopBar({ status, onRefresh }) {
  const [copied, setCopied] = useState(null);
  const copy = (text, key) => {
    navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(null), 1500);
  };

  const isOnline = status?.online;
  const isSleeping = status && !status.online;

  return (
    <div style={S.topBar}>
      {/* Row 1: Title left, status right */}
      <div style={S.topRow1}>
        <h1 style={S.topTitle}>Bangman's Abode</h1>
        <div style={S.statusDotWrap}>
          <div style={{
            ...S.statusDot,
            background: isOnline ? C.online : isSleeping ? C.sleeping : C.offline,
            boxShadow: `0 0 10px ${isOnline ? C.online : isSleeping ? C.sleeping : C.offline}50`,
          }} />
          <span style={S.statusLabel}>
            {isOnline ? "Online" : isSleeping ? "Sleeping" : "Checking..."}
          </span>
          {isOnline && (
            <span style={S.playerCount}>{status.players?.online || 0} players</span>
          )}
          <button onClick={onRefresh} style={S.refreshBtn} title="Refresh status">
            {Icons.refresh}
          </button>
        </div>
      </div>
      {/* Row 2: Full-width address buttons */}
      <div style={S.topRow2}>
        <button onClick={() => copy(SERVER_JAVA, "java")} style={{
          ...S.addressPill,
          borderColor: copied === "java" ? C.accent : C.border,
        }}>
          <span style={S.addressType}>Java Edition</span>
          <span style={S.addressText}>{SERVER_JAVA}</span>
          <span style={S.copyLabel}>{copied === "java" ? "Copied!" : "Copy"}</span>
        </button>
        <button onClick={() => copy(SERVER_BEDROCK, "bedrock")} style={{
          ...S.addressPill,

          <span style={S.copyLabel}>{copied === "bedrock" ? "Copied!" : "Copy"}</span>
        </button>
      </div>
    </div>
  );
}

function PlayerPanel({ status }) {
  const players = status?.players?.list || [];
  return (
    <div style={S.playerPanel}>
      <div style={S.playerHeader}>Players Online</div>
      {players.length > 0 ? players.map((p, i) => (
        <div key={i} style={S.playerRow}>
          <img
            src={`https://mc-heads.net/avatar/${p.name || p.uuid}/24`}
            alt="" style={S.playerAvatar}
            onError={(e) => { e.target.style.display = "none"; }}
          />
          <span style={S.playerName}>{p.name || `Player ${i + 1}`}</span>
        </div>
      )) : (
        <div style={S.playerEmpty}>
          <span style={{ fontSize: 20 }}>💤</span>
          <span>No one online</span>
          <span style={{ fontSize: 10, color: C.textMuted }}>Be the first!</span>

  );
}

// ─── PLAYGROUND TAB ───────────────────────────────────────────────────
function PlaygroundTab() {
  const [obs, setObs] = useState({});
  const handleMove = useCallback((type, x, y, w, h) => {
    setObs((p) => ({ ...p, [type]: { x, y, w, h } }));
  }, []);
  const obsList = Object.values(obs);
  const playText =
    "Welcome to the text reflow playground. Drag any of these Minecraft blocks around and watch the text dynamically wrap around them in real time. This effect is powered by Canvas-based text measurement inspired by Cheng Lou's Pretext library. Each frame, the engine calculates available width per line, subtracting space occupied by obstacles, then reflows words to fit. No DOM measurement, no layout thrashing — just pure arithmetic. The result is buttery smooth text that responds instantly to dragged objects. Try stacking blocks, lining them up along one edge, or scattering them across the page. The text will always find a way to flow around them. This is the kind of layout behavior that was previously impossible in browsers without heavy JavaScript. Now it takes two function calls.";

  return (
    <div style={S.playWrap}>
      <h2 style={S.sectionTitle}>Text Reflow Playground</h2>
      <p style={S.sectionSub}>Drag the blocks and watch the text flow</p>
      <div style={S.playArea}>
        <DraggableBlock type="grass" ix={20} iy={10} onMove={handleMove} size={52} />
        <DraggableBlock type="diamond" ix={340} iy={60} onMove={handleMove} size={52} />
        <DraggableBlock type="creeper" ix={160} iy={160} onMove={handleMove} size={52} />
        <DraggableBlock type="tnt" ix={400} iy={200} onMove={handleMove} size={52} />
        <DraggableBlock type="gold" ix={60} iy={280} onMove={handleMove} size={52} />
        <ReflowText text={playText} obstacles={obsList} />
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────
function Dashboard() {
  const [tab, setTab] = useState("home");
  const [status, setStatus] = useState(null);

  const fetchStatus = useCallback(async () => {
    try {
      const r = await fetch(STATUS_API, { headers: { "User-Agent": "BangmanDash/2.0" } });
      if (r.ok) setStatus(await r.json());
    } catch (e) { /* silent */ }
  }, []);

  useEffect(() => {
    fetchStatus();
    const t = setInterval(fetchStatus, REFRESH_MS);
    return () => clearInterval(t);
  }, [fetchStatus]);

  return (
    <div style={S.root}>
      <Sidebar active={tab} onChange={setTab} />
      <div style={S.main}>
        <TopBar status={status} onRefresh={fetchStatus} />
        <div style={S.content}>
          {tab === "home" && (
            <>
              <StatusCards status={status} />
              <div style={S.connectCTA} onClick={() => setTab("connect")}>
                <div style={S.ctaLeft}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.accentBright} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2a4 4 0 014 4c0 3-4 6-4 6s-4-3-4-6a4 4 0 014-4z" />
                    <circle cx="12" cy="6" r="1" fill={C.accentBright} />
                    <path d="M12 14v4M8 22h8" />
                  </svg>
                  <div>
                    <span style={S.ctaTitle}>Need help connecting?</span>
                    <span style={S.ctaDesc}>Step-by-step guides for PC, Xbox, PlayStation, and Switch</span>
                  </div>
                </div>
                <span style={S.ctaArrow}>→</span>
              </div>
              <MapSection status={status} />
            </>
          )}
          {tab === "map" && <MapSection status={status} fullscreen />}
          {tab === "connect" && <ConnectTab />}
          {tab === "play" && <PlaygroundTab />}
        </div>
      </div>
    </div>
  );
}
