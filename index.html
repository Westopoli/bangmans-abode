// Format an ISO timestamp as "3m ago", "2h ago", "yesterday", etc.
// Returns null if the input is missing/invalid so the caller can hide the UI.
function timeAgo(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return null;
  const diffSec = (Date.now() - t) / 1000;
  if (diffSec < 30)   return "just now";
  if (diffSec < 90)   return "1m ago";
  if (diffSec < 3600) return `${Math.round(diffSec / 60)}m ago`;
  if (diffSec < 7200) return "1h ago";
  if (diffSec < 86400) return `${Math.round(diffSec / 3600)}h ago`;
  if (diffSec < 172800) return "yesterday";
  return `${Math.round(diffSec / 86400)}d ago`;
}

// ─── TOP BAR ──────────────────────────────────────────────────────────
function TopBar({ status, summary, onRefresh }) {
  const [copied, setCopied] = useState(null);
  const [tick, setTick] = useState(0); // forces relative-time re-render every 30s
  const copy = (text, key) => {
    navigator.clipboard.writeText(text);
    setCopied(key);
    setTimeout(() => setCopied(null), 1500);
  };

  // Re-render every 30s so "3m ago" naturally becomes "4m ago" without a poll.
  useEffect(() => {
    const id = setInterval(() => setTick((n) => n + 1), 30_000);
    return () => clearInterval(id);
  }, []);

  const isOnline = status?.online;
  const isSleeping = status && !status.online;
  const statsAge = timeAgo(summary?.updated_at);

  return (
    <div style={S.topBar}>
      {/* Row 1: Title left, status right */}
      <div style={S.topRow1}>
        <h1 style={S.topTitle}>Bangman's Abode</h1>
        <div style={S.statusDotWrap}>
          <div style={{
            ...S.statusDot,
            background: isOnline ? C.online : isSleeping ? C.sleeping : C.offline,
            boxShadow: `0 0 10px ${isOnline ? C.online : isSleeping ? C.sleeping : C.offline}50`,
          }} />
          <span style={S.statusLabel}>
            {isOnline ? "Online" : isSleeping ? "Sleeping" : "Checking..."}
          </span>
          {isOnline && (
            <span style={S.playerCount}>{status.players?.online || 0} players</span>
          )}
          {statsAge && (
            <span
              style={S.statsAge}
              title="When the playtime tracker last recorded a sample. Updates every ~5 min."
            >
              · stats {statsAge}
            </span>
          )}
          <button onClick={onRefresh} style={S.refreshBtn} title="Refresh status">
            {Icons.refresh}
          </button>
        </div>
      </div>
      {/* Row 2: Full-width address buttons */}
      <div style={S.topRow2}>
        <button onClick={() => copy(SERVER_JAVA, "java")} style={{
          ...S.addressPill,
          borderColor: copied === "java" ? C.accent : C.border,
        }}>
          <span style={S.addressType}>Java Edition</span>
          <span style={S.addressText}>{SERVER_JAVA}</span>
          <span style={S.copyLabel}>{copied === "java" ? "Copied!" : "Copy"}</span>
        </button>
        <button onClick={() => copy(SERVER_BEDROCK, "bedrock")} style={{
          ...S.addressPill,
          borderColor: copied === "bedrock" ? C.accent : C.border,
        }}>
          <span style={S.addressType}>Bedrock</span>
          <span style={S.addressText}>{SERVER_BEDROCK}</span>
          <span style={S.copyLabel}>{copied === "bedrock" ? "Copied!" : "Copy"}</span>
        </button>
      </div>
    </div>
  );
}

// ─── CONNECTION GUIDE ─────────────────────────────────────────────────

    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const [copied, setCopied] = useState(null);

          <Step n={4}>

          <Step n={5}>
            For <Val>Server Address</Val>, copy and paste this:

// ─── FIRST-VISIT MAP OVERLAY ──────────────────────────────────────────
const HINT_KEY = "bangman.mapHintSeen";
function MapHintOverlay() {
  const [visible, setVisible] = useState(() => {
    try { return localStorage.getItem(HINT_KEY) !== "1"; }
    catch (e) { return true; }
  });
  if (!visible) return null;
  const dismiss = () => {
    try { localStorage.setItem(HINT_KEY, "1"); } catch (e) { /* private mode etc. */ }
    setVisible(false);
  };
  return (
    <div style={S.hintBackdrop} onClick={dismiss}>
      <div style={S.hintCard} onClick={(e) => e.stopPropagation()}>
        <button onClick={dismiss} style={S.hintClose} title="Dismiss" aria-label="Dismiss">
          {Icons.close}
        </button>
        <div style={S.hintTitle}>Welcome to the map</div>
        <div style={S.hintSub}>Switch view modes from BlueMap's top-right toolbar.</div>
        <div style={S.hintRows}>
          {MAP_MODES.map((m) => (
            <div key={m.id} style={S.hintRow}>
              <div style={S.mapGuideIcon}>{m.icon}</div>
              <div style={S.mapGuideRowText}>
                <div style={S.mapGuideRowTitle}>
                  {m.title}
                  {m.badge && <span style={S.mapGuideBadge}>{m.badge}</span>}
                </div>
                <div style={S.mapGuideRowDesc}>{m.desc}</div>
              </div>
            </div>
          ))}
        </div>
        <button onClick={dismiss} style={S.hintCta}>Got it</button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────
function Dashboard() {
  const [tab, setTab] = useState("home");
  const [status, setStatus] = useState(null);
  const [summary, setSummary] = useState(null);

  const fetchStatus = useCallback(async () => {
    try {
      const r = await fetch(STATUS_API, { headers: { "User-Agent": "BangmanDash/2.0" } });
      if (r.ok) setStatus(await r.json());
    } catch (e) { /* silent */ }
  }, []);

  // Fetch the rolled-up stats file produced by the GitHub Action poller.
  // Cache-busting query param so we always get the freshest commit, not
  // a stale CDN copy. If the file doesn't exist yet (Action hasn't run),
  // the catch swallows it and the indicator just doesn't render.
  const fetchSummary = useCallback(async () => {
    try {
      const r = await fetch(`./data/playtime-summary.json?t=${Date.now()}`);
      if (r.ok) setSummary(await r.json());
    } catch (e) { /* silent */ }
  }, []);

  const refreshAll = useCallback(() => {
    fetchStatus();
    fetchSummary();
  }, [fetchStatus, fetchSummary]);

  useEffect(() => {
    refreshAll();
    const t = setInterval(refreshAll, REFRESH_MS);
    return () => clearInterval(t);
  }, [refreshAll]);

  return (
    <div style={S.root}>
      <Sidebar active={tab} onChange={setTab} />
      <div style={S.main}>
        <TopBar status={status} summary={summary} onRefresh={refreshAll} />
        <div style={S.content}>
          {tab === "home" && (
            <>
              <StatusCards status={status} />
              <div style={S.connectCTA} onClick={() => setTab("connect")}>
                <div style={S.ctaLeft}>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.accentBright} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 2a4 4 0 014 4c0 3-4 6-4 6s-4-3-4-6a4 4 0 014-4z" />
                    <circle cx="12" cy="6" r="1" fill={C.accentBright} />
                    <path d="M12 14v4M8 22h8" />
                  </svg>
                  <div>
                    <span style={S.ctaTitle}>I don't know what to do bro</span>
                    <span style={S.ctaDesc}>Step-by-step guides for PC, Xbox, PlayStation, and Switch</span>
                  </div>
                </div>
                <span style={S.ctaArrow}>→</span>
              </div>
              <MapControlsGuide />
              <MapSection status={status} />
            </>
          )}
          {tab === "map" && <MapSection status={status} fullscreen />}
          {tab === "connect" && <ConnectTab />}
          {tab === "dad" && (
            <div style={S.dadWrap}>
              <img src={DAD_IMG} alt="Dad" style={S.dadImg} />
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
